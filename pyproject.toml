[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hellward"
version = "0.2.0"
description = "Hellward — a gothic tower defence where demon leaders curse your towers (Python rules server, Godot client)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ilya Kamenshchikov", email = "ilya.kamenshchikov@gmail.com" }]
dependencies = ["sagaforge"]   # the audio cues and music, and the asset tools; the server needs nothing but Python

[project.optional-dependencies]
dev = ["pytest>=9.0.2", "mypy>=2.3.1", "setuptools>=84"]  # mypy brings mypyc, which compiles the simulation (hellward/fastsim.py)

[project.scripts]
hellward = "hellward.__main__:main"

[tool.uv.sources]
sagaforge = { path = "../sagaforge", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["hellward"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["hellward/sim"]   # the simulation that hellward/fastsim.py compiles must type-check
exclude = [
    "hellward/sim/players/adaptive.py",
    "hellward/sim/players/planned.py",
    "hellward/sim/players/warden.py",
]   # the strong players run interpreted, for now
