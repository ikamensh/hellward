# Every tower kind, with one value per rank in each list. price is a role factor on the gold unit (rank prices follow
# economy.rank_cost_units); damage_role multiplies the Arrow's hit at that rank (economy.arrow_hit + rank), while
# damage lists a support tower's fraction directly. rate is attacks per second; range in tiles.
# attack: "bolt", "chain", "nova", "venom", "amplify" or "aura". bolt_speed in tiles per second.

[arrow]
name = "Arrow Tower"
element = "physical"
attack = "bolt"
price = 1.0
damage_role = 1.0
rate = [1.0, 1.05, 1.1]
range = [2.8, 3.0, 3.2]
bolt_speed = 12.0
blurb = "Fires one arrow at the monster closest to the sanctuary."

[pyre]
name = "Pyre"
element = "fire"
attack = "bolt"
price = 1.5
damage_role = 1.5
rate = [1.0, 1.0, 1.05]
range = [3.0, 3.2, 3.4]
bolt_speed = 8.0
blurb = "Hurls a firebolt at one enemy; a forged chamber can later give it a blast."

[storm]
name = "Storm Obelisk"
element = "lightning"
attack = "chain"
price = 1.7
damage_role = 1.5
rate = [1.2, 1.3, 1.4]
range = [2.8, 3.0, 3.2]
bolt_speed = 9.0
blurb = "Strikes one enemy with lightning; a forged coil can later make it leap."

[frost]
name = "Frost Shrine"
element = "cold"
attack = "bolt"
price = 1.4
damage_role = 0.5
rate = [0.6, 0.65, 0.7]
range = [2.0, 2.2, 2.4]
chill = [0.35, 0.45, 0.55]          # slow a chill applies (0.4 = 40% slower, and 40% weaker blows on gates)
chill_time = [2.0, 2.2, 2.5]
bolt_speed = 9.0
blurb = "A cold bolt chills one enemy: slower feet, weaker blows on doors."

[plague]
name = "Plague Totem"
element = "poison"
attack = "venom"
price = 1.5
damage_role = 0.5
poison_role = 0.5                   # damage per second of one venom stack, on the Arrow's scale
poison_time = [4.0, 4.0, 4.5]
rate = [0.8, 0.85, 0.9]
range = [3.0, 3.2, 3.4]
bolt_speed = 7.0
blurb = "Venom seeks the strongest monster it can poison; poison stacks up to four times."

[altar]
name = "Bone Altar"
element = "bone"
attack = "amplify"
price = 1.6
damage = [0.15, 0.20, 0.25]         # extra share of damage an amplified monster takes
rate = [0.25, 0.2777777777777778, 0.3125]
range = [3.0, 3.2, 3.4]
splash = [1.0, 1.2, 1.4]            # the knot's radius
lasting = [2.0, 2.2, 2.5]           # seconds an amplification lasts
bolt_speed = 9.0
blurb = "Lays Amplify Damage on the thickest knot of monsters in reach: they take more damage from everything."

[grove]
name = "Druid Grove"
element = "nature"
attack = "aura"
price = 1.6
damage = [0.10, 0.15, 0.20]         # damage bonus lent to towers within range
rate = [0.0, 0.0, 0.0]
range = [1.5, 1.5, 2.3]
bolt_speed = 9.0
blurb = "Its aura makes every tower within reach strike harder. Groves do not stack."
