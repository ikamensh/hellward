# Every tower kind, with one value per rank in each list. price is a role factor on the gold unit (rank prices follow
# economy.rank_cost_units, or the kind's own rank_cost_units when it names them); damage_role multiplies the Arrow's
# hit at that rank (economy.arrow_hit + rank), while damage lists a hit directly, or a support tower's fraction.
# rate is attacks per second; range in tiles.
# attack: "bolt", "chain", "nova", "venom", "hook", "amplify" or "aura". bolt_speed in tiles per second.
# Physical towers share the Steel column's rank skills (hellward/sim/skills.py).

[arrow]
name = "Arrow Tower"
element = "physical"
attack = "bolt"
price = 1.0
damage_role = 1.0
rate = [1.0, 1.05, 1.1]
range = [2.8, 3.0, 3.2]
bolt_speed = 12.0
blurb = "Fires one arrow at the monster closest to the sanctuary."

[ballista]
name = "Ballista"
element = "physical"
attack = "bolt"
price = 1.5
damage = [7.0, 10.0, 14.0]          # its hit: armor takes as much off a heavy bolt as off an arrow
rate = [0.4, 0.42, 0.45]
range = [3.2, 3.4, 3.6]
bolt_speed = 14.0
blurb = "Looses a heavy bolt, slowly, at the monster closest to the sanctuary: armor takes little from a hit this big."

[hook]
name = "Hook Tower"
element = "physical"
attack = "hook"
price = 1.5
damage = [3.0, 4.0, 5.0]
rate = [0.16666666666666666, 0.2, 0.25]   # a hook every 6, 5 and 4 seconds, while it has a monster to hook
range = [2.8, 3.0, 3.2]
bolt_speed = 9.0                    # unused: the chain strikes at once
blurb = "Hooks the foremost small monster past it and drags it two tiles back, flyers too. Never the same monster twice, never one at a gate."

[knife]
name = "Knife Post"
element = "physical"
attack = "bolt"
price = 1.0
damage = [2.0, 3.0, 4.0]
rate = [0.8, 0.85, 0.9]
range = [2.6, 2.8, 3.0]
bolt_speed = 11.0
blurb = "Throws at a small monster standing at a gate or held, if one is in reach, twice as hard; otherwise at the foremost."

[pyre]
name = "Pyre"
element = "fire"
attack = "bolt"
price = 1.5
damage = [3.0, 4.0, 5.0]            # by one a rank: a bigger jump would make rank III worth more per gold than a new
                                    # Pyre against armor (design-criteria R3)
rate = [1.0, 1.0, 1.05]
range = [3.0, 3.2, 3.4]
bolt_speed = 8.0
blurb = "Hurls a firebolt at one enemy; a forged chamber can later give it a blast."

[storm]
name = "Storm Obelisk"
element = "lightning"
attack = "chain"
price = 1.7
damage_role = 1.5
rank_cost_units = [1.0, 0.9, 1.0]   # rank II's hit jumps 3 to 5, so its price does too, keeping rank I the best damage
                                    # per gold (R3)
rate = [1.2, 1.3, 1.3]              # rank III's bigger hit is its gain; a faster one too would beat a new Obelisk (R3)
range = [2.8, 3.0, 3.2]
bolt_speed = 9.0
blurb = "Strikes one enemy with lightning; a forged coil can later make it leap."

[frost]
name = "Frost Shrine"
element = "cold"
attack = "bolt"
price = 1.4
damage = [1.0, 1.0, 1.0]            # its ranks deepen the chill; a harder hit would beat a new Shrine per gold (R3)
rate = [0.6, 0.65, 0.7]
range = [2.0, 2.2, 2.4]
chill = [0.35, 0.45, 0.55]          # slow a chill applies (0.4 = 40% slower, and 40% weaker blows on gates)
chill_time = [5.0, 5.5, 6.0]        # long enough to shatter by: the kill lands while the chill holds
bolt_speed = 9.0
blurb = "A cold bolt chills one enemy: slower feet, weaker blows on doors."

[plague]
name = "Plague Totem"
element = "poison"
attack = "venom"
price = 1.5
damage = [1.0, 1.0, 1.0]
poison = [1.0, 1.5, 2.0]            # damage per second of one venom stack (damage over time is not rounded)
poison_time = [1e9, 1e9, 1e9]   # venom never fades: a re-hit pair bursts instead
rate = [1.2, 1.25, 1.3]
range = [3.0, 3.2, 3.4]
bolt_speed = 7.0
blurb = "Venom seeks the strongest monster in reach; a second stack bursts the pair."

[altar]
name = "Bone Altar"
element = "bone"
attack = "amplify"
price = 1.6
damage = [0.15, 0.20, 0.25]         # extra share of damage an amplified monster takes
rate = [0.25, 0.2777777777777778, 0.3125]
range = [3.0, 3.2, 3.4]
splash = [1.0, 1.2, 1.4]            # the knot's radius
lasting = [2.0, 2.2, 2.5]           # seconds an amplification lasts
bolt_speed = 9.0
blurb = "Lays Amplify Damage on the thickest knot of monsters in reach: they take more damage from everything."
verb = "corpse"           # its amplified dead burst where the Bone column is learnt: corpses it makes
verb_role = "produce"

[grove]
name = "Druid Grove"
element = "nature"
attack = "aura"
price = 1.6
damage = [0.10, 0.15, 0.20]         # damage bonus lent to towers within range
rate = [0.0, 0.0, 0.0]
range = [1.5, 1.5, 2.3]
bolt_speed = 9.0
blurb = "Its aura makes every tower within reach strike harder. Groves do not stack."

[idol]
name = "Sentinel Idol"
element = "bone"
attack = "aura"
price = 1.25          # cheap enough to lean into: free casts are the cast verb's engine
damage = [0.0, 0.0, 0.0]          # it never strikes: its rite smites for it
rate = [0.0, 0.0, 0.0]
range = [4.0, 4.5, 5.0]
bolt_speed = 9.0
blurb = "Every 45 s it smites the foremost monster in reach, free: a cast that counts."
verb = "cast"
verb_role = "produce"

[censer]
name = "Martyr's Censer"
element = "fire"
attack = "aura"
price = 2.0
damage = [0.0, 0.0, 0.0]          # it never strikes: a leak near it immolates the field
rate = [0.0, 0.0, 0.0]
range = [2.5, 3.0, 3.5]
bolt_speed = 9.0
blurb = "When a monster reaches the shrine in its reach, it immolates the field. Once a wave."
verb = "leak"
verb_role = "consume"

[well]
