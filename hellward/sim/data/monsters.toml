# Every monster kind. life is the monster's life, the same at every location; speed in tiles per second; bounty weighs its share of
# a wave's gold; lives is what it costs the sanctuary; door_dps its blows on a gate; size its drawn height in tiles.
# protected and vulnerable name elements whose hits it takes at battle.protected and battle.vulnerable (at most two
# tags between them, a boss may have more; physical is never tagged); armor is taken off every hit (at least 1 is
# dealt). A boss (boss = true) has no lives of its own: each strike at the shrine costs battle.boss_strike_lives and
# sends it back to its portal. movement: "wander" takes a seeded detour, "direct" the shortest route.
# A leader table names its curses; its other numbers default to battle.leader_defaults.

