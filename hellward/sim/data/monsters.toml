# Every monster kind. life is a role factor on economy.base_hp; speed in tiles per second; bounty weighs its share of
# a wave's gold; lives is what it costs the sanctuary; door_dps its blows on a gate; size its drawn height in tiles.
# resist: 1.0 immune, negative a weakness. movement: "wander" takes a seeded detour, "direct" the shortest route.
