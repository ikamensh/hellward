# The skill tree's content: every skill by key. A tower kind is locked until its
# `unlock_` skill is learned (the Arrow is free); ranks and specials chain by tier.
# Conventions `hellward.sim.skills` derives (no extra fields): `unlock_<kind>`
# opens a tower kind, `unlock_<spell>` a spell, `adept_*` is rank II, `master_*`
# rank III. Tiers run 1 to 5; a skill needs the one above it in its column.

[columns]
arrow = "Arrow"
ballista = "Ballista"
hook = "Hook"
knife = "Knife"
idol = "Idol"
censer = "Censer"
well = "Well"
effigy = "Effigy"
fire = "Fire"
lightning = "Lightning"
cold = "Cold"
poison = "Poison"
bone = "Bone"
nature = "Nature"
warding = "Warding"
sorcery = "Sorcery"
spells = "Battle Magic"

